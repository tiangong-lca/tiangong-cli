name: supabase-consumer-closure

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'bin/**'
      - 'contracts/supabase-consumer-manifest.v3.json'
      - 'contracts/supabase-consumer-manifest.v3.schema.json'
      - 'test/data-api-consumer-scan.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase-consumer-closure.yml'

permissions:
  contents: read

jobs:
  exact-consumer-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for immutable-tree verification
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify exact AST-derived candidate manifest
        run: npm run lint:data-api-consumers

      - name: Run positive and negative closure tests
        run: node --import tsx --test test/data-api-consumer-scan.test.ts

      - name: Typecheck audit contract
        run: npm run typecheck
