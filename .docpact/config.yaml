version: 1
layout: repo
# Review note, 2026-06-11: release 0.0.15 keeps existing command-family, validation, and release routing. The dataset import-lca wrapper now targets the tidas-tools 0.0.28 process-bundle CLI surface; routing and ownership are unchanged.
# Review note, 2026-07-12: owner-draft BAFU `merge-support-aliases` now sends both frozen dimensions through one whole-plan RPC; it remains inside the existing dataset-maintenance command/runtime domain, and wildcard routing already covers its request/proof adapter, alias-rewrite, tests, and governed command/validation docs, so no ownership or route changes are required.
# Review note, 2026-07-13: exact-count maintenance pagination remains inside the existing dataset-maintenance command/runtime domain. Wildcard routing already covers its shared paginator, account scans, tests, and governed command/validation docs, so no ownership or route changes are required.
# Review note, 2026-07-14: derivative rebuild remains inside the existing dataset-maintenance command/runtime and remote-adapter domains. Existing `src/lib/dataset-*.ts`, `src/cli.ts`, and `test/**` wildcards already cover its guarded-RPC adapter, action-scoped snapshot, terminal verification, and proof tests; no ownership or route changes are required.
# Review note, 2026-07-15: the production-only protected owner-draft runner remains inside the existing dataset-maintenance command/runtime and remote-adapter domains. Existing `src/lib/dataset-*.ts`, `src/cli.ts`, and `test/**` wildcards cover its sealed request contract, one-shot admission, immutable local evidence, status-only recovery, and 23-flow + 27-process terminal proof; no ownership, routing, dependency, or release-rule change is required.
# Review note, 2026-07-15: Issue #171 protected freeze/seal preparation remains inside the existing dataset-maintenance command/runtime, remote-adapter, artifact, and validation domains. Existing `src/lib/dataset-*.ts`, `src/cli.ts`, `test/**`, and governed-doc wildcards cover production-read-only capture, offline byte-exact approval sealing, canonical toolchain evidence, and their tests; no ownership, routing, dependency, auth, or release-rule change is required.
# Review note, 2026-07-16: Issue #175 changes only the protected preflight proof's bounded client clock-skew validation and safe timing diagnostics. Existing dataset-maintenance and test wildcards already cover the implementation, tests, and governed docs; no ownership, routing, dependency, auth, database, or release-rule change is required.
# Review note, 2026-07-16: Issue #177 removes Windows-only assumptions from existing CLI tests. The same test and validation wildcards cover native path handling, deterministic spawn doubles, and platform-appropriate permission assertions; no runtime, ownership, routing, dependency, auth, database, protected-execution, or release-rule change is required.
# Review note, 2026-07-16: Issue #178 is the dedicated 0.0.27 package-version release after Issues #175 and #177. It changes only package metadata, the package-version dispatch fixture, and governed review records; ownership, routing, dependencies, protected execution, database behavior, tag automation, Trusted Publishing, and workspace-integration rules remain unchanged.
# Review note, 2026-07-16: Issue #182 corrects the protected verifier's cross-hash-domain comparison inside the existing dataset-maintenance runtime and tests. Existing wildcards and ownership cover the CLI-plan, database action-evidence, derivative-snapshot, and terminal-proof bridge; no routing, dependency, auth, database, release, or integration rule changes are required.
# Review note, 2026-07-16: Issue #184 is the dedicated 0.0.28 package-version release for merged Issue #182. It changes only package metadata, the live package-version fixture, and governed review records; ownership, routing, dependencies, protected execution, database behavior, tag automation, Trusted Publishing, and workspace-integration rules remain unchanged.
# Review note, 2026-07-16: Issue #186 adds the authenticated LCI/LCIA data-release command family. `src/lib/lca-release.ts` owns manager-scoped Edge command calls, exact four-ZIP upload verification, Calculation Bundle projection, and hash-checked file downloads; it is routed separately from this package's npm release automation.
# Review note, 2026-07-17: Issue #191 removes two Windows-only POSIX permission assumptions from the LCI/LCIA release tests. Existing `test/**` ownership and validation/release routing already cover platform-appropriate mode checks and the POSIX-only chmod failure case; no runtime, ownership, routing, dependency, auth, tag, or publishing rule changes are required.
# Review note, 2026-07-16: Issue #157 adds the native dataset-maintenance flow-identity capture/plan/freeze/seal/run/verify family inside existing command, remote-adapter, artifact, validation, and release routing. It adds no dependency, alternate auth, service-role, tag, or publishing path; the existing src/lib/dataset-*.ts, src/cli.ts, test/**, and governed-doc rules cover the implementation.
# Review note, 2026-07-17: Issue #157 COMMON hardening remains inside the same flow-identity command, remote-adapter, artifact, validation, and release domains. Both Issue #29 derivative prerequisites require separate passed readbacks; HTTP-success `ok:false` envelopes are deterministic domain rejections; and verifier `pending` is limited to `derivatives_pending`. The protected runner now uses a database-enforced one-wrapper rotating permit as the cross-machine authority, a strict local approval claim as defense in depth, and a fresh exact recovery approval plus read-only scope lookup after permit or preflight-response loss. The remaining production gate is merge, Preview validation, and coordinated DB/CLI release, not an unresolved protocol design. No ownership, routing, dependency, auth, tag, or publishing rule changes are required.
